<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fostering Futures Donor Pledge Card</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(#ffd86b,#f5b700);
  margin:0;
  padding:0;
}

.container {
  max-width: 600px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 6px 18px rgba(0,0,0,.15);
}

.logo {
  text-align:center;
}

.logo img {
  width:100%;
  max-width:260px;
}

h1 {
  text-align:center;
  color:#b88600;
}

label {
  font-weight:bold;
  display:block;
  margin-top:15px;
}

input, select, textarea {
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:16px;
}

button {
  background:#f5b700;
  color:white;
  border:none;
  padding:14px;
  width:100%;
  font-size:18px;
  border-radius:10px;
  margin-top:20px;
  cursor:pointer;
}

button:hover {
  background:#d49a00;
}

.note {
  font-size:13px;
  margin-top:15px;
  color:#555;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
<img src="Logo.jpg">
</div>

<h1>Donor Pledge Card</h1>

<form>

<label>Full Name</label>
<input type="text">

<label>Email</label>
<input type="email">

<label>Phone</label>
<input type="tel">

<label>Giving Level</label>
<select>
<option>$50 Supporter</option>
<option>$100 Friend</option>
<option>$250 Sponsor</option>
<option>$500 Scholarship Sponsor</option>
<option>$1000+ Champion</option>
</select>

<label>Payment Method</label>
<select>
<option>Zelle</option>
<option>Cash App</option>
<option>PayPal</option>
<option>Check</option>
</select>

<label>Message (optional)</label>
<textarea rows="3"></textarea>

<a href="PASTE_YOUR_PAYMENT_LINK_HERE" target="_blank">
  <button type="button">Donate Now</button>
</a>

<p class="note">
Checks payable to:<br>
<strong>Fostering Futures Foundation A NJ Nonprofit</strong><br><br>
This pledge must be paid using one of the available payment methods listed above.  
Electronic pledge payment directly from this form will be available when the website is live.
</p>
</form>

</div>

</body>
</html>
